<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; padding: 0; background: black; overflow: hidden; }
        #subscriber { width: 1280px; height: 720px; position: absolute; top: 0; left: 0; }
        #chatOverlay { position: absolute; bottom: 20px; left: 20px; width: 400px; height: 300px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; z-index: 10; }
        .chat-bubble { background: rgba(0,0,0,0.7); color: white; padding: 10px 15px; border-radius: 8px; font-family: sans-serif; font-size: 18px; }
    </style>
    <script src="https://static.opentok.com/v2/js/opentok.min.js"></script>
</head>
<body>
    <div id="subscriber"></div>
    <div id="chatOverlay"></div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const roomName = params.get('room');
        const overlay = document.getElementById('chatOverlay');

        async function initComposer() {
            const res = await fetch(`/room/${roomName}`);
            const data = await res.json();
            
            const session = OT.initSession(data.applicationId, data.sessionId);
            
            session.on('streamCreated', (event) => {
                session.subscribe(event.stream, 'subscriber', { insertMode: 'append', width: '100%', height: '100%' });
            });

            session.on('signal:chat', (event) => {
                const msgData = JSON.parse(event.data);
                const bubble = document.createElement('div');
                bubble.className = 'chat-bubble';
                bubble.innerHTML = `<b>${msgData.sender}:</b> ${msgData.text}`;
                overlay.appendChild(bubble);
                
                if (overlay.children.length > 5) overlay.removeChild(overlay.firstChild);
            });

            session.connect(data.token);
        }
        initComposer();
    </script>
</body>
</html>
